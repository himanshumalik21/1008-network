<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#061626" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D4B2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5CD" />
      <stop offset="100%" stop-color="#00A68C" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="124" fill="url(#bgG)" />
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#rim)" stroke-width="4.5" />

  <!-- Centered Modern 1008 Wordmark Icon -->
  <g transform="translate(256, 290)">
    <!-- 1008 in ultra-bold modern typography -->
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="142" 
          font-weight="900" 
          letter-spacing="-0.06em" 
          text-anchor="middle" 
          fill="#FFFFFF">
      1<tspan fill="#635BFF">0</tspan><tspan fill="#00D4B2">0</tspan>8
    </text>
    
    <!-- Modern Tech Accent Pill Bar below -->
    <rect x="-90" y="32" width="180" height="10" rx="5" fill="url(#dotGrad)" />
  </g>
</svg>